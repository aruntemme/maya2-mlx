<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call Kayal</title>
<style>
  :root {
    --bg: #f5f4f0; --fg: #1c1b19; --muted: #6e6a63; --card: #ffffff; --line: #e3e0d8;
    --me: #1f6f54; --me-fg: #ffffff; --accent: #1f6f54; --end: #b3261e; --dot: #c9c5bb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --fg: #ecebe7; --muted: #9a968e; --card: #1f1e1c; --line: #33312c;
      --me: #2f8f6c; --me-fg: #ffffff; --accent: #3fb68b; --end: #e5675f; --dot: #4a4741;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Tamil", system-ui, sans-serif;
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 560px; height: 100dvh; display: flex; flex-direction: column; }
  header { padding: 16px 16px 10px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: #fff; display: grid;
            place-items: center; font-weight: 700; font-size: 18px; flex: none; position: relative; }
  .avatar.speaking::after { content: ""; position: absolute; inset: -5px; border-radius: 50%;
            border: 2px solid var(--accent); animation: pulse 1.1s ease-out infinite; }
  @keyframes pulse { from { opacity: .9; transform: scale(.95); } to { opacity: 0; transform: scale(1.25); } }
  .who { flex: 1; min-width: 0; }
  .name { font-weight: 650; font-size: 18px; line-height: 1.2; }
  #state { font-size: 14px; color: var(--muted); }
  #timer { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px;
         overscroll-behavior: contain; }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 300px; }
  .bubble { max-width: 82%; padding: 9px 13px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble.kayal { align-self: flex-start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .bubble.me { align-self: flex-end; background: var(--me); color: var(--me-fg); border-bottom-right-radius: 6px; }
  .bubble.me.interim { opacity: .6; }
  .bubble.me.interim::after { content: " …"; }
  footer { padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line);
           display: flex; gap: 12px; justify-content: center; align-items: center; }
  button { border: 0; cursor: pointer; font: 600 16px/1 inherit; border-radius: 999px; height: 52px; padding: 0 22px; }
  button:disabled { opacity: .55; cursor: default; }
  #call { background: var(--accent); color: #fff; min-width: 150px; }
  #call.live { background: var(--end); }
  #mute { background: var(--card); color: var(--fg); border: 1px solid var(--line); display: none; }
  #mute.on { background: var(--fg); color: var(--bg); }
  .live-only { display: none; }
  body.in-call #mute { display: inline-block; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar" id="avatar">க</div>
    <div class="who">
      <div class="name">Kayal</div>
      <div id="state">Tamil or English · this network</div>
    </div>
    <div id="timer"></div>
  </header>
  <div id="log"><div class="empty" id="empty">Tap <b>Call</b> and allow the microphone.<br>பேசுங்க, Kayal கேக்குறா.</div></div>
  <footer>
    <button id="mute" aria-pressed="false">Mute</button>
    <button id="call">Call</button>
  </footer>
</div>
<script src="livekit-client.umd.js"></script>
<script>
const { Room, RoomEvent, Track } = LivekitClient;
const $ = (id) => document.getElementById(id);
const log = $("log"), callBtn = $("call"), muteBtn = $("mute"), stateEl = $("state"), avatar = $("avatar"), timerEl = $("timer");
const STATES = { initializing: "Connecting…", listening: "Listening…", thinking: "Thinking…", speaking: "Speaking", idle: "Listening…" };
let room = null, timer = null, startedAt = 0;
const bubbles = new Map();            // segment id -> bubble element (one per utterance, updated in place)

function nearBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 80; }
function bubbleFor(id, cls) {
  let b = bubbles.get(id);
  if (!b) {
    $("empty")?.remove();
    b = document.createElement("div");
    b.className = "bubble " + cls;
    log.appendChild(b);
    bubbles.set(id, b);
  }
  return b;
}
function show(b, text, stick) {
  b.textContent = text;
  if (!text.trim()) b.remove(); else if (stick) log.scrollTop = log.scrollHeight;
}
function setState(s) {
  stateEl.textContent = STATES[s] || s;
  avatar.classList.toggle("speaking", s === "speaking");
}
function tick() {
  const s = Math.floor((Date.now() - startedAt) / 1000);
  timerEl.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}

async function start() {
  callBtn.disabled = true;
  setState("initializing");
  try {
    const { token } = await (await fetch("/token", { cache: "no-store" })).json();
    room = new Room({ audioCaptureDefaults: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    room.on(RoomEvent.TrackSubscribed, (track) => {
      if (track.kind === Track.Kind.Audio) document.body.appendChild(track.attach());
    });
    room.on(RoomEvent.ParticipantAttributesChanged, (changed) => {
      if (changed["lk.agent.state"]) setState(changed["lk.agent.state"]);
    });
    room.on(RoomEvent.Disconnected, () => end(false));
    // Captions: the agent publishes both sides on this topic. Your speech arrives as repeated full-text updates of one
    // segment (interim, then final); Kayal's arrives as one stream per segment with words appended as she speaks.
    room.registerTextStreamHandler("lk.transcription", async (reader) => {
      const a = reader.info.attributes || {};
      const id = a["lk.segment_id"] || reader.info.id;
      const mine = room.localParticipant.getTrackPublications().some((p) => p.trackSid === a["lk.transcribed_track_id"]);
      const b = bubbleFor(id, mine ? "me" : "kayal");
      if (mine) {
        const stick = nearBottom();
        show(b, await reader.readAll(), stick);
        b.classList.toggle("interim", a["lk.transcription_final"] !== "true");
      } else {
        let text = b.textContent;
        for await (const chunk of reader) { const stick = nearBottom(); text += chunk; show(b, text, stick); }
      }
    });
    await room.connect(`wss://${location.host}`, token);
    await room.localParticipant.setMicrophoneEnabled(true);
    document.body.classList.add("in-call");
    callBtn.textContent = "End call";
    callBtn.classList.add("live");
    startedAt = Date.now(); tick(); timer = setInterval(tick, 1000);
    setState("listening");
  } catch (e) {
    stateEl.textContent = "Couldn't connect: " + (e && e.message ? e.message : e);
    if (room) await room.disconnect();
    room = null;
  }
  callBtn.disabled = false;
}

async function end(disconnect = true) {
  if (room && disconnect) await room.disconnect();
  room = null;
  clearInterval(timer);
  document.querySelectorAll("audio").forEach((el) => el.remove());
  document.body.classList.remove("in-call");
  callBtn.textContent = "Call";
  callBtn.classList.remove("live");
  muteBtn.classList.remove("on"); muteBtn.textContent = "Mute"; muteBtn.setAttribute("aria-pressed", "false");
  setState("Call ended · tap Call to talk again");
  avatar.classList.remove("speaking");
  bubbles.clear();
}

callBtn.addEventListener("click", () => (room ? end() : start()));
muteBtn.addEventListener("click", async () => {
  if (!room) return;
  const muted = !muteBtn.classList.contains("on");
  await room.localParticipant.setMicrophoneEnabled(!muted);
  muteBtn.classList.toggle("on", muted);
  muteBtn.textContent = muted ? "Unmute" : "Mute";
  muteBtn.setAttribute("aria-pressed", String(muted));
});
</script>
</body>
</html>
